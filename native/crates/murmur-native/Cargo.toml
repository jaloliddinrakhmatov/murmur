[package]
name = "murmur-native"
edition.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Unused CGEventTap for modifier-only shortcuts (R6, needs Input Monitoring, not approved).
# Off by default so the release addon does not contain it.
key-tap = []

[dependencies]
murmur-core = { path = "../murmur-core" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[build-dependencies]
napi-build = "2"
